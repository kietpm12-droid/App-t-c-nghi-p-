<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu khách hàng</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    .box {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #1677ff;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🔎 Tra cứu khách hàng</h1>

  <input
    id="phone"
    type="tel"
    placeholder="Nhập số điện thoại"
  >

  <button id="searchBtn">
    TRA CỨU
  </button>

  <div id="result"></div>

</div>

<script>

const API_URL = "https://app-t-c-nghi-p.onrender.com";

document.getElementById("searchBtn").addEventListener("click", async function () {

  const phone = document.getElementById("phone").value.trim();
  const result = document.getElementById("result");
  const button = document.getElementById("searchBtn");

  if (phone === "") {
    result.innerHTML = "⚠️ Vui lòng nhập số điện thoại.";
    return;
  }

  result.innerHTML = "⏳ Đang tra cứu...";
  button.disabled = true;

  try {

    const url =
      API_URL + "/api/search?phone=" + encodeURIComponent(phone);

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Server lỗi: " + response.status);
    }

    const data = await response.json();

    if (data.found === true) {

      result.innerHTML = `
        <strong>✅ Đã tìm thấy</strong>
        <br><br>
        Họ tên: ${data.data.name}
        <br>
        Số điện thoại: ${data.data.phone}
        <br>
        Ghi chú: ${data.data.note}
      `;

    } else {

      result.innerHTML = "❌ Không tìm thấy thông tin.";

    }

  } catch (error) {

    console.error(error);

    result.innerHTML =
      "❌ Không kết nối được với máy chủ.";

  }

  button.disabled = false;

});

</script>

</body>
</html>
