<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quản lý khách hàng</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f1f5f9;
      padding: 15px;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    .header {
      background: #1677ff;
      color: white;
      padding: 22px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save {
      background: #1677ff;
      color: white;
    }

    .gps {
      background: #16a34a;
      color: white;
    }

    .search {
      background: #111827;
      color: white;
    }

    .customer {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
    }

    .customer strong {
      font-size: 18px;
    }

    .map {
      display: inline-block;
      margin-top: 10px;
      color: #1677ff;
      text-decoration: none;
    }

    .delete {
      background: #dc2626;
      color: white;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #f3f4f6;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📋 Quản lý khách hàng</h1>
    <div>Thêm và tra cứu thông tin khách hàng</div>
  </div>

  <!-- THÊM KHÁCH HÀNG -->

  <div class="card">

    <h2>➕ Thêm khách hàng</h2>

    <label>Họ tên *</label>
    <input
      id="name"
      type="text"
      placeholder="Nhập họ tên"
    >

    <label>Địa chỉ</label>
    <input
      id="address"
      type="text"
      placeholder="Nhập địa chỉ"
    >

    <label>Số điện thoại *</label>
    <input
      id="phone"
      type="tel"
      placeholder="Nhập số điện thoại"
    >

    <label>Ghi chú</label>
    <textarea
      id="note"
      placeholder="Nhập ghi chú..."
    ></textarea>

    <button class="gps" onclick="getGPS()">
      📍 LẤY VỊ TRÍ GPS
    </button>

    <div id="gpsResult" class="message">
      Chưa lấy vị trí
    </div>

    <button class="save" onclick="addCustomer()">
      💾 LƯU KHÁCH HÀNG
    </button>

    <div id="addResult"></div>

  </div>


  <!-- TÌM KIẾM -->

  <div class="card">

    <h2>🔎 Tra cứu khách hàng</h2>

    <input
      id="search"
      type="text"
      placeholder="Nhập tên hoặc số điện thoại"
      oninput="searchCustomers()"
    >

    <div id="customers">
      Đang tải dữ liệu...
    </div>

  </div>

</div>


<script>

const API_URL = "https://app-t-c-nghi-p.onrender.com";

let latitude = null;
let longitude = null;


// ==========================
// LẤY GPS
// ==========================

function getGPS() {

  const gpsResult = document.getElementById("gpsResult");

  if (!navigator.geolocation) {

    gpsResult.innerHTML =
      "❌ Thiết bị không hỗ trợ GPS.";

    return;
  }

  gpsResult.innerHTML =
    "⏳ Đang lấy vị trí...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude = position.coords.latitude;
      longitude = position.coords.longitude;

      gpsResult.innerHTML =
        "✅ Đã lấy vị trí:<br>" +
        "Latitude: " + latitude + "<br>" +
        "Longitude: " + longitude;

    },

    function(error) {

      gpsResult.innerHTML =
        "❌ Không lấy được GPS. Hãy cho phép trình duyệt sử dụng vị trí.";

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );

}


// ==========================
// THÊM KHÁCH HÀNG
// ==========================

async function addCustomer() {

  const name =
    document.getElementById("name").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const note =
    document.getElementById("note").value.trim();

  const addResult =
    document.getElementById("addResult");


  if (!name) {

    addResult.innerHTML =
      "⚠️ Vui lòng nhập họ tên.";

    return;
  }


  if (!phone) {

    addResult.innerHTML =
      "⚠️ Vui lòng nhập số điện thoại.";

    return;
  }


  addResult.innerHTML =
    "⏳ Đang lưu...";


  try {

    const response = await fetch(
      API_URL + "/api/customers",
      {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          name: name,

          address: address,

          phone: phone,

          note: note,

          latitude: latitude,

          longitude: longitude

        })

      }
    );


    const data = await response.json();


    if (!data.success) {

      addResult.innerHTML =
        "❌ " + data.message;

      return;
    }


    addResult.innerHTML =
      "✅ Đã lưu khách hàng thành công!";


    // Xóa form

    document.getElementById("name").value = "";

    document.getElementById("address").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("note").value = "";

    latitude = null;

    longitude = null;

    document.getElementById("gpsResult").innerHTML =
      "Chưa lấy vị trí";


    loadCustomers();

  }

  catch (error) {

    console.error(error);

    addResult.innerHTML =
      "❌ Không kết nối được với máy chủ.";

  }

}


// ==========================
// TẢI DANH SÁCH
// ==========================

async function loadCustomers() {

  const container =
    document.getElementById("customers");


  try {

    const response = await fetch(
      API_URL + "/api/customers"
    );

    const data = await response.json();


    if (!data.success) {

      container.innerHTML =
        "❌ Không tải được dữ liệu.";

      return;
    }


    displayCustomers(data.data);

  }

  catch (error) {

    container.innerHTML =
      "❌ Không kết nối được với máy chủ.";

  }

}


// ==========================
// HIỂN THỊ
// ==========================

function displayCustomers(list) {

  const container =
    document.getElementById("customers");


  if (!list || list.length === 0) {

    container.innerHTML =
      "Chưa có khách hàng.";

    return;
  }


  container.innerHTML = "";


  list.forEach(customer => {

    let gpsHTML = "";


    if (
      customer.latitude &&
      customer.longitude
    ) {

      gpsHTML = `

        <br>

        📍 GPS:

        ${customer.latitude},
        ${customer.longitude}

        <br>

        <a
          class="map"
          target="_blank"
          href="https://www.google.com/maps?q=${customer.latitude},${customer.longitude}"
        >
          🗺️ Mở Google Maps
        </a>

      `;

    }


    const div =
      document.createElement("div");

    div.className = "customer";


    div.innerHTML = `

      <strong>
        ${escapeHTML(customer.name)}
      </strong>

      <br><br>

      📞 SĐT:
      ${escapeHTML(customer.phone)}

      <br>

      🏠 Địa chỉ:
      ${escapeHTML(customer.address || "Chưa có")}

      <br>

      📝 Ghi chú:
      ${escapeHTML(customer.note || "Không có")}

      ${gpsHTML}

      <button
        class="delete"
        onclick="deleteCustomer(${customer.id})"
      >
        🗑️ XÓA
      </button>

    `;


    container.appendChild(div);

  });

}


// ==========================
// TÌM KIẾM
// ==========================

async function searchCustomers() {

  const keyword =
    document.getElementById("search")
    .value
    .trim()
    .toLowerCase();


  try {

    const response = await fetch(
      API_URL + "/api/customers"
    );

    const data = await response.json();


    if (!data.success) return;


    const filtered =
      data.data.filter(customer =>

        customer.name
          .toLowerCase()
          .includes(keyword)

        ||

        customer.phone
          .toLowerCase()
          .includes(keyword)

      );


    displayCustomers(filtered);

  }

  catch (error) {

    console.error(error);

  }

}


// ==========================
// XÓA
// ==========================

async function deleteCustomer(id) {

  const confirmDelete =
    confirm(
      "Bạn có chắc muốn xóa khách hàng này?"
    );


  if (!confirmDelete) return;


  try {

    await fetch(
      API_URL + "/api/customers/" + id,
      {
        method: "DELETE"
      }
    );


    loadCustomers();

  }

  catch (error) {

    alert(
      "Không thể xóa khách hàng."
    );

  }

}


// ==========================
// CHỐNG CHÈN HTML
// ==========================

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// ==========================
// CHẠY KHI MỞ TRANG
// ==========================

loadCustomers();

</script>

</body>
</html>
