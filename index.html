
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thông Tin Khách Hàng</title>
    <!-- Tailwind CSS & Leaflet Map -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <!-- Màn hình Đăng nhập -->
    <div id="login-screen" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-lg shadow-md text-center">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Hệ Thống Quản Lý KH</h1>
        <button id="btn-login" class="w-full bg-red-600 text-white py-3 px-4 rounded-lg font-semibold hover:bg-red-700 transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
            Đăng nhập bằng Gmail
        </button>
    </div>

    <!-- Màn hình Chính (Ẩn khi chưa đăng nhập) -->
    <div id="main-screen" class="max-w-4xl mx-auto hidden space-y-6">
        <!-- Header -->
        <div class="bg-white p-4 rounded-lg shadow flex justify-between items-center">
            <div>
                <span class="text-sm text-gray-500">Xin chào,</span>
                <h2 id="user-email" class="font-bold text-gray-800"></h2>
            </div>
            <button id="btn-logout" class="text-sm bg-gray-200 px-3 py-1.5 rounded hover:bg-gray-300">Đăng xuất</button>
        </div>

        <!-- Form Nhập Liệu -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="text-lg font-bold mb-4 text-blue-600">Thêm Khách Hàng Mới</h3>
            <form id="customer-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="fullname" placeholder="Họ và tên khách (*)" required class="p-2 border rounded w-full">
                    <input type="tel" id="phone" placeholder="Số điện thoại (nếu có)" class="p-2 border rounded w-full">
                    <input type="text" id="address" placeholder="Địa chỉ (*)" required class="p-2 border rounded w-full">
                    <input type="text" id="cccd" placeholder="4 số cuối CCCD (*)" maxlength="4" required class="p-2 border rounded w-full">
                </div>
                
                <div class="flex items-center gap-2">
                    <button type="button" id="btn-gps" class="bg-green-600 text-white px-3 py-2 rounded text-sm hover:bg-green-700">Lấy vị trí GPS hiện tại</button>
                    <span id="gps-status" class="text-xs text-gray-500">Chưa lấy GPS</span>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Ảnh nhà (Chụp/Tải lên):</label>
                    <input type="file" id="photo" accept="image/*" capture="environment" class="w-full text-sm">
                </div>

                <textarea id="note" placeholder="Ghi chú thêm..." class="p-2 border rounded w-full h-20"></textarea>
                
                <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Lưu Thông Tin</button>
            </form>
        </div>

        <!-- Bản đồ Tổng quan -->
        <div class="bg-white p-4 rounded-lg shadow">
            <h3 class="text-lg font-bold mb-2">Bản Đồ Check-in Tổng Quan</h3>
            <div id="map" class="h-64 rounded-lg"></div>
        </div>

        <!-- Danh sách & Tìm kiếm -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="text-lg font-bold mb-4">Danh Sách Khách Hàng</h3>
            <input type="text" id="search" placeholder="🔍 Tìm kiếm theo tên khách hàng..." class="p-2 border rounded w-full mb-4">
            
            <div id="customer-list" class="space-y-3">
                <!-- Data sẽ tự động cập nhật ở đây -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBWSVRJfFilPUGA9D8M0MEwM6Gx3gwBmXI",
  authDomain: "field-collection-bbf17.firebaseapp.com",
  databaseURL: "https://field-collection-bbf17-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "field-collection-bbf17",
  storageBucket: "field-collection-bbf17.firebasestorage.app",
  messagingSenderId: "1067382365687",
  appId: "1:1067382365687:web:923c44fca3aa9eb9c362f2",
  measurementId: "G-5XXZ0EG7CB"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentGPS = null;
        let allCustomers = [];
        let map, markersGroup;

        // Xử lý Đăng nhập / Đăng xuất
        document.getElementById('btn-login').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        document.getElementById('btn-logout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;
                initMap();
                listenToData();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('main-screen').classList.add('hidden');
            }
        });

        // Xử lý Lấy vị trí GPS
        document.getElementById('btn-gps').onclick = () => {
            const status = document.getElementById('gps-status');
            status.innerText = "Đang lấy vị trí...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    status.innerText = `Đã lấy: ${currentGPS.lat.toFixed(4)}, ${currentGPS.lng.toFixed(4)}`;
                    status.classList.add('text-green-600');
                },
                () => { status.innerText = "Lỗi! Không thể lấy GPS."; status.classList.add('text-red-600'); }
            );
        };

        // Chuyển ảnh thành chuỗi Base64 lưu trực tiếp
        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // Xử lý Submit Form
        document.getElementById('customer-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = "Đang lưu...";

            try {
                let photoData = "";
                const photoFile = document.getElementById('photo').files[0];
                if (photoFile) photoData = await fileToBase64(photoFile);

                await addDoc(collection(db, "customers"), {
                    fullname: document.getElementById('fullname').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    cccd: document.getElementById('cccd').value,
                    gps: currentGPS,
                    photo: photoData,
                    note: document.getElementById('note').value,
                    createdBy: auth.currentUser.email,
                    createdAt: serverTimestamp()
                });

                document.getElementById('customer-form').reset();
                document.getElementById('gps-status').innerText = "Chưa lấy GPS";
                currentGPS = null;
                alert("Đã lưu thông tin thành công!");
            } catch (err) {
                alert("Lỗi khi lưu dữ liệu: " + err.message);
            }
            btn.disabled = false;
            btn.innerText = "Lưu Thông Tin";
        };

        // Khởi tạo bản đồ
        function initMap() {
            if (!map) {
                map = L.map('map').setView([10.762622, 106.660172], 10);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                markersGroup = L.layerGroup().addTo(map);
            }
        }

        // Lắng nghe dữ liệu thời gian thực (Realtime Update)
        function listenToData() {
            const q = query(collection(db, "customers"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                allCustomers = [];
                snapshot.forEach(doc => allCustomers.push({ id: doc.id, ...doc.data() }));
                renderList(allCustomers);
                updateMap(allCustomers);
            });
        }

        // Render Danh sách thu gọn (Click để xem chi tiết)
        function renderList(data) {
            const listEl = document.getElementById('customer-list');
            listEl.innerHTML = "";
            
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "border rounded-lg p-3 bg-gray-50 hover:bg-white transition cursor-pointer";
                card.innerHTML = `
                    <div class="flex justify-between items-center font-bold text-gray-800">
                        <span>${item.fullname}</span>
                        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">CCCD: ***${item.cccd}</span>
                    </div>
                    <div id="details-${item.id}" class="hidden mt-3 pt-3 border-t text-sm space-y-2 text-gray-600">
                        <p><strong>SĐT:</strong> ${item.phone || 'Không có'}</p>
                        <p><strong>Địa chỉ:</strong> ${item.address}</p>
                        <p><strong>GPS:</strong> ${item.gps ? `${item.gps.lat}, ${item.gps.lng}` : 'Chưa cập nhật'}</p>
                        <p><strong>Ghi chú:</strong> ${item.note || 'Không có'}</p>
                        <p class="text-xs text-gray-400">Người nhập: ${item.createdBy}</p>
                        ${item.photo ? `<img src="${item.photo}" class="mt-2 max-h-48 rounded border object-cover">` : ''}
                    </div>
                `;
                card.onclick = () => {
                    const detailEl = document.getElementById(`details-${item.id}`);
                    detailEl.classList.toggle('hidden');
                };
                listEl.appendChild(card);
            });
        }

        // Tìm kiếm thời gian thực
        document.getElementById('search').oninput = (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allCustomers.filter(c => c.fullname.toLowerCase().includes(keyword));
            renderList(filtered);
        };

        // Cập nhật Marker trên bản đồ
        function updateMap(data) {
            markersGroup.clearLayers();
            data.forEach(item => {
                if (item.gps) {
                    L.marker([item.gps.lat, item.gps.lng])
                     .bindPopup(`<b>${item.fullname}</b><br>${item.address}`)
                     .addTo(markersGroup);
                }
            });
        }
    </script>
</body>
</html>
