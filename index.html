
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Tác Nghiệp Khách Hàng</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; color: #333; }
        .card { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; color: #1e3a8a; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .btn-gps { background-color: #2563eb; color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .btn-gps:hover { background-color: #1d4ed8; }
        .btn-submit { background-color: #16a34a; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-submit:hover { background-color: #15803d; }
        #preview { max-width: 100%; height: auto; border-radius: 6px; margin-top: 10px; display: none; }
        .gps-status { font-size: 12px; color: #6b7280; margin-top: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>TÁC NGHIỆP KHÁCH HÀNG</h2>
    <form id="appForm">
        <div class="form-group">
            <label>Tên khách hàng (*)</label>
            <input type="text" id="fullname" required placeholder="Nhập họ và tên">
        </div>

        <div class="form-group">
            <label>4 số cuối CCCD (*)</label>
            <input type="text" id="cccdLast4" maxlength="4" pattern="\d{4}" required placeholder="Ví dụ: 5678">
        </div>

        <div class="form-group">
            <label>Số điện thoại (*)</label>
            <input type="tel" id="phone" required placeholder="09xxxxxxxx">
        </div>

        <div class="form-group">
            <label>Địa chỉ nhà (*)</label>
            <textarea id="address" rows="2" required placeholder="Số nhà, đường, phường/xã..."></textarea>
        </div>

        <div class="form-group">
            <label>Định vị nhà khách hàng (GPS)</label>
            <input type="text" id="gpsLocation" readonly placeholder="Tọa độ Kinh độ, Vĩ độ">
            <button type="button" class="btn-gps" onclick="getGPS()">📍 Lấy vị trí hiện tại</button>
            <div id="gpsStatus" class="gps-status"></div>
        </div>

        <div class="form-group">
            <label>Tình trạng tác nghiệp (*)</label>
            <select id="status" required>
                <option value="">-- Chọn tình trạng --</option>
                <option value="Đã gặp - Đồng ý">Đã gặp - Đồng ý</option>
                <option value="Đã gặp - Từ chối">Đã gặp - Từ chối</option>
                <option value="Không có nhà">Không có nhà</option>
                <option value="Sai địa chỉ">Sai địa chỉ</option>
                <option value="Khác">Khác</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ảnh CCCD / Hình ảnh (Tải lên từ thiết bị)</label>
            <!-- Đã loại bỏ thuộc tính capture="environment" -->
            <input type="file" id="cccdImage" accept="image/*" onchange="previewImage(event)">
            <img id="preview" alt="Xem trước ảnh CCCD">
        </div>

        <button type="submit" class="btn-submit">LƯU THÔNG TIN</button>
    </form>
</div>

<script>
    // Hàm lấy vị trí GPS từ điện thoại
    function getGPS() {
        const gpsInput = document.getElementById('gpsLocation');
        const gpsStatus = document.getElementById('gpsStatus');

        if ("geolocation" in navigator) {
            gpsStatus.innerText = "Đang tìm vị trí...";
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    gpsInput.value = `${lat}, ${lng}`;
                    gpsStatus.innerText = "✓ Lấy vị trí thành công!";
                },
                (error) => {
                    gpsStatus.innerText = "❌ Không thể lấy vị trí. Vui lòng bật GPS trên thiết bị.";
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            gpsStatus.innerText = "Trình duyệt không hỗ trợ định vị GPS.";
        }
    }

    // Xem trước ảnh chọn từ thư viện
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById('preview');
            output.src = reader.result;
            output.style.display = 'block';
        };
        if (event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    // Xử lý khi nhấn Submit Form
    document.getElementById('appForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const data = {
            fullname: document.getElementById('fullname').value,
            cccdLast4: document.getElementById('cccdLast4').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            gps: document.getElementById('gpsLocation').value,
            status: document.getElementById('status').value,
            timestamp: new Date().toLocaleString('vi-VN')
        };

        console.log("Dữ liệu tác nghiệp:", data);
        alert("Lưu dữ liệu thành công!\n(Dữ liệu hiện tại đang xuất ra console trình duyệt)");
    });
</script>

</body>
</html>
